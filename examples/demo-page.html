<!doctype html>
<meta charset="utf-8">
<title>Account settings</title>
<style>
  :root { --ink:#1b1f24; --muted:#6b7280; --line:#e3e6ea; --blue:#2c6ee1; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f4f6f8; color:var(--ink);
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .wrap { width:520px; margin:40px auto 80px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px;
          padding:26px 30px 30px; margin-bottom:22px; position:relative; }
  h1 { font-size:19px; font-weight:600; margin:0 0 4px; }
  h2 { font-size:15px; font-weight:600; margin:0 0 14px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 22px; }
  label { display:block; font-size:13px; font-weight:500; margin:0 0 6px; }
  .field { margin-bottom:16px; }
  input, select { width:100%; height:38px; padding:0 11px; font:inherit;
    color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:6px; }
  input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(44,110,225,.15); }
  .row { display:flex; gap:12px; } .row .field { flex:1; }
  .save { width:100%; height:40px; margin-top:8px; border:0; border-radius:6px;
    background:var(--blue); color:#fff; font:inherit; font-weight:500; cursor:pointer; }
  .save:active { background:#2258b8; }
  .banner { height:38px; border-radius:6px; margin-top:14px; display:none;
    align-items:center; padding:0 12px; font-size:14px; font-weight:500; color:#fff; }
  .banner.show { display:flex; }
  .banner.err { background:#e04b4a; } .banner.ok { background:#20a06e; }
  .item { display:flex; align-items:center; justify-content:space-between;
    padding:11px 2px; border-bottom:1px solid var(--line); font-size:14px; }
  .item:last-child { border-bottom:0; }
  .item .when { color:var(--muted); font-size:13px; }

  /* ---- the wreckage ---- */
  .row .field:last-child { margin-left:-46px; margin-top:23px; }
  #email { width:132%; position:relative; left:-9px; }
  #tz { height:27px; width:61%; transform:rotate(-1.4deg); background:#fdf6e3; }
  label[for="tz"] { margin-left:118px; color:#c0392b; letter-spacing:2px; }
  .danger { position:absolute; top:96px; left:236px; z-index:5;
    background:#e04b4a; color:#fff; border:0; border-radius:5px;
    padding:7px 13px; font:inherit; font-size:13px; cursor:pointer;
    transform:rotate(3deg); box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .stray { position:absolute; top:-13px; left:-34px; background:#20a06e;
    color:#fff; font-size:11px; font-weight:600; padding:3px 9px;
    border-radius:3px; transform:rotate(-14deg); z-index:6; }
  .item:nth-child(3) { padding-left:78px; background:#fff3cd; }
  .item:nth-child(7) .when { display:block; float:none; margin-left:-190px;
    color:#2c6ee1; text-decoration:underline; }
  #list .item:nth-child(5) { transform:translateX(41px); }
</style>

<div class="wrap">
  <div class="card">
    <span class="stray">BETA</span>
    <button class="danger">Delete account</button>
    <h1>Account settings</h1>
    <p class="sub">Update your profile and regional preferences.</p>
    <div class="row">
      <div class="field"><label for="first">First name</label><input id="first" value="Alex"></div>
      <div class="field"><label for="last">Last name</label><input id="last" value="Rivera"></div>
    </div>
    <div class="field"><label for="email">Email address</label><input id="email" value="alex@example.com"></div>
    <div class="field"><label for="tz">Time zone</label>
      <select id="tz">
        <option>GMT+05:30 — India Standard Time</option>
        <option>GMT+00:00 — Coordinated Universal Time</option>
        <option>GMT-08:00 — Pacific Time</option>
      </select>
    </div>
    <button class="save" id="save">Save changes</button>
    <div class="banner" id="banner"></div>
  </div>

  <div class="card">
    <h2>Recent activity</h2>
    <div id="list"></div>
  </div>
</div>

<script>
  const rows = [
    ['Signed in from Bengaluru','2 minutes ago'],['Changed time zone','1 hour ago'],
    ['Updated email address','Yesterday'],['Signed in from Mumbai','Yesterday'],
    ['Password changed','3 days ago'],['Enabled two-factor auth','3 days ago'],
    ['Signed in from Bengaluru','4 days ago'],['Revoked API token','5 days ago'],
    ['Created API token','5 days ago'],['Signed in from Delhi','1 week ago'],
    ['Updated billing address','1 week ago'],['Downloaded invoice','2 weeks ago'],
    ['Signed in from Bengaluru','2 weeks ago'],['Changed plan to Pro','3 weeks ago'],
    ['Closed a support ticket','3 weeks ago'],['Opened a support ticket','1 month ago'],
    ['Signed in from Pune','1 month ago'],['Account created','2 months ago']];
  document.getElementById('list').innerHTML = rows.map(
    r => `<div class="item"><span>${r[0]}</span><span class="when">${r[1]}</span></div>`).join('');

  // The save resolves fine. For 120ms on the way there it renders the
  // failure branch, then corrects itself.
  const banner = document.getElementById('banner');
  document.getElementById('save').addEventListener('click', () => {
    banner.className = 'banner'; void banner.offsetWidth;
    setTimeout(() => {
      banner.textContent = "Couldn't save changes";
      banner.className = 'banner err show';
      setTimeout(() => {
        banner.textContent = 'Changes saved';
        banner.className = 'banner ok show';
      }, 120);
    }, 260);
  });

  // Scrolling is driven by hand and skips two frames out of every six, at a
  // constant speed on the frames it does run -- the stutter comes from the
  // dropped frames, not from the speed changing.
  let pending = 0, ticking = false, f = 0;
  addEventListener('wheel', e => {
    e.preventDefault();
    pending += e.deltaY;
    if (!ticking) { ticking = true; requestAnimationFrame(step); }
  }, { passive: false });

  function step() {
    f++;
    if (!(f % 6 === 0 || f % 6 === 1) && pending !== 0) {
      const move = Math.sign(pending) * Math.min(Math.abs(pending), 55);
      scrollBy(0, move);
      pending -= move;
      if (Math.abs(pending) < 1) pending = 0;
    }
    if (pending !== 0) requestAnimationFrame(step); else ticking = false;
  }
</script>
