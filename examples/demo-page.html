<!doctype html>
<meta charset="utf-8">
<title>Account settings</title>
<style>
  :root { --ink:#1b1f24; --muted:#6b7280; --line:#e3e6ea; --blue:#2c6ee1; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#f4f6f8; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         color:var(--ink); }
  .card { width:440px; background:#fff; border:1px solid var(--line);
          border-radius:10px; padding:28px 32px 32px; }
  h1 { font-size:19px; font-weight:600; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 24px; }
  label { display:block; font-size:13px; font-weight:500; margin:0 0 6px; }
  .field { margin-bottom:18px; }
  input, select, .trigger {
    width:100%; height:38px; padding:0 11px; font:inherit; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:6px; }
  input:focus, .trigger.focus { outline:none; border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(44,110,225,.15); }
  .trigger { text-align:left; display:flex; align-items:center;
             justify-content:space-between; cursor:pointer; }
  .trigger .chev { color:var(--muted); font-size:11px; }
  .combo { position:relative; }
  /* The menu is anchored 7px left of the trigger and sits 9px below it.
     It should be flush at left:0 with a 4px gap. */
  .menu { position:absolute; left:-7px; top:calc(100% + 9px); width:100%;
          background:#fff; border:1px solid var(--line); border-radius:6px;
          box-shadow:0 6px 16px rgba(16,24,40,.10); padding:4px;
          display:none; z-index:10; }
  .menu.open { display:block; }
  .menu button { display:block; width:100%; text-align:left; font:inherit;
                 padding:7px 9px; border:0; border-radius:4px;
                 background:none; cursor:pointer; color:var(--ink); }
  .menu button:hover { background:#f2f5f9; }
  .row { display:flex; gap:12px; }
  .row .field { flex:1; }
  .save { width:100%; height:40px; margin-top:6px; border:0; border-radius:6px;
          background:var(--blue); color:#fff; font:inherit; font-weight:500;
          cursor:pointer; }
  .save:active { background:#2258b8; }
</style>

<div class="card">
  <h1>Account settings</h1>
  <p class="sub">Update your profile and regional preferences.</p>

  <div class="row">
    <div class="field"><label for="first">First name</label><input id="first" value="Rohit"></div>
    <div class="field"><label for="last">Last name</label><input id="last" value="Diggi"></div>
  </div>

  <div class="field">
    <label for="email">Email address</label>
    <input id="email" value="rohit@example.com">
  </div>

  <div class="field combo">
    <label for="country">Country</label>
    <button class="trigger" id="country" aria-haspopup="listbox" aria-expanded="false">
      <span id="countryValue">India</span><span class="chev">&#9662;</span>
    </button>
    <div class="menu" id="countryMenu" role="listbox">
      <button role="option">India</button>
      <button role="option">United States</button>
      <button role="option">United Kingdom</button>
      <button role="option">Germany</button>
      <button role="option">Singapore</button>
      <button role="option">Australia</button>
    </div>
  </div>

  <div class="field">
    <label for="tz">Time zone</label>
    <select id="tz">
      <option>GMT+05:30 — India Standard Time</option>
      <option>GMT+00:00 — Coordinated Universal Time</option>
      <option>GMT-08:00 — Pacific Time</option>
    </select>
  </div>

  <button class="save">Save changes</button>
</div>

<script>
  const trigger = document.getElementById('country');
  const menu = document.getElementById('countryMenu');
  const value = document.getElementById('countryValue');
  let busy = false;

  trigger.addEventListener('click', () => {
    if (menu.classList.contains('open')) { close(); return; }
    if (busy) return;
    busy = true;
    // Focus ring lands immediately, the menu does not. Nothing else
    // acknowledges the click for the next 1.4 seconds.
    trigger.classList.add('focus');
    setTimeout(() => {
      menu.classList.add('open');
      trigger.setAttribute('aria-expanded', 'true');
      busy = false;
    }, 1400);
  });

  function close() {
    menu.classList.remove('open');
    trigger.classList.remove('focus');
    trigger.setAttribute('aria-expanded', 'false');
  }

  menu.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => { value.textContent = b.textContent; close(); });
  });
</script>
